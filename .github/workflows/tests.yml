name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (no GPU, no LLM)
        run: pytest tests/ -x -q
        env:
          # Dummy env so controller imports don't fail on missing vars
          VLLM_BASE_URL: "http://localhost:8000/v1"
          VLLM_API_KEY: "dummy"
          VLLM_MODEL: "dummy"
          AGENTPROF_MACHINE: "local_pc_win11"
