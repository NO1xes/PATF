[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentprof"
version = "0.4.0"
description = "Methodology-driven profiling controller for agent systems under workload"
requires-python = ">=3.11"
dependencies = [
    # LangChain stack — pinned to versions confirmed on overseas server 2026-05-21
    "langchain==1.3.1",
    "langchain-openai==1.2.1",
    "langgraph==1.2.0",
    "openai==2.37.0",
    # Other deps — install latest, then freeze with: pip freeze > requirements.lock.txt
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentprof*", "targets*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
