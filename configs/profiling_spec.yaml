experiment_name: controlled_langchain_react_mvp
stage: MVP-0

profiling_object: agent_system_under_workload

outputs:
  - events_jsonl
  - timeline_csv
  - breakdown_json
  - resource_snapshot_csv
  - resource_health_json
  - report_md
  - known_unknowns

constraints:
  do_optimization: false
  forbidden_actions:
    - change_concurrency
    - change_arrival_rate
    - toggle_cache
    - set_timeout
    - set_quota
    - apply_patch
    - modify_prompt
    - modify_planner

# Observers active from the very first run (baseline)
initial_baseline:
  semantic_trace: true
  llm_client_timing: true
  tool_events: true
  coarse_resource_snapshot: true

stop_condition:
  max_iterations: 2
  max_wall_time_minutes: 30
