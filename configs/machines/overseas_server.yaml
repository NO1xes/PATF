# Machine Configuration: overseas_server (template)
# Generic template for a shared overseas Linux GPU server.
# Copy and rename to <machine_id>.yaml, fill in hardware values.
# Private paths (conda env, workspace, ports) go in <machine_id>.local.yaml (gitignored).
#
# See configs/machines/nusa100.local.yaml.example for the local config template.

machine_id: overseas_server   # replace with actual machine id
os: Linux
os_version: TBD
shared: true

hardware:
  gpu: TBD             # e.g. "NVIDIA A100-SXM4-80GB"
  gpu_count: TBD
  gpu_memory_per: TBD  # e.g. "80 GiB"
  cpu_cores: TBD
  ram_total: TBD

resource_limits:
  cpu_cores_max: TBD   # e.g. 1/8 of total
  ram_max: TBD
  gpu_count_max: 1
  gpu_memory_utilization_max: 0.90
  max_processes: 32
  disk_gb: 20

git:
  auth_method: https_pat   # SSH key typically not available on shared servers
  remote: "https://github.com/NO1xes/AgentProf.git"
  config_scope: local      # MUST use --local, never --global on shared servers

network:
  region: overseas
  pip_mirror: null
  hf_mirror: null

capabilities:
  - langchain_tests
  - vllm_backend
  - tier2_integration
  - tier3_experiments

vllm:
  model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  tensor_parallel_size: 1
  tool_call_parser: hermes
  notes: "See .env for VLLM_BASE_URL, VLLM_PYTHON, HF_HOME. See scripts/start_vllm.sh for startup."
