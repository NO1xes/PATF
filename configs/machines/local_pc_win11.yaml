# Machine Configuration: local_pc_win11
# Personal Windows 11 PC, China mainland, no GPU.
# Role: API-based experiments and development. NOT for large-scale vLLM runs.
#
# This file is a template for adding new machines.
# Copy it, rename to <machine_id>.yaml, and fill in the values.

machine_id: local_pc_win11
owner: NO1xes
os: Windows 11 Home China
os_version: "10.0.26200"
shared: false

hardware:
  gpu: none
  gpu_count: 0
  notes: "No GPU. Cannot run vLLM locally. Use remote API endpoint."

python:
  version: "3.13.5"
  manager: conda
  conda_base: "E:/miniconda3"
  recommended_env_name: agentprof
  recommended_python: "3.11"  # create env with 3.11 for best compatibility

workspace:
  path: "d:/JediXing/Documents/HUST/class/26spring/Multiagent/agent4profiling/stage1-knowledge/2026-05-13/agentprof"
  profile_output: "./profiles"

git:
  auth_method: ssh
  remote: "git@github.com:NO1xes/PATF.git"
  config_scope: global  # personal machine, global config is fine
  notes: "SSH key confirmed working as of 2026-05-14."

network:
  region: china_mainland
  pip_mirror: "https://pypi.tuna.tsinghua.edu.cn/simple"
  hf_mirror: "https://hf-mirror.com"
  github_ssh: reachable
  notes: >
    pip mirror recommended for faster installs.
    Set HF_ENDPOINT=https://hf-mirror.com in .env for HuggingFace downloads.
    GitHub SSH is reachable directly.

vllm:
  available: false
  notes: "No GPU. Point VLLM_BASE_URL in .env to a remote vLLM server or use OpenAI API."

capabilities:
  - api_experiments       # call remote LLM API, run LangChain agent
  - development           # write and test code
  - small_local_models    # could run tiny models via CPU if needed (not recommended)

# --- Template notes for new machines ---
# When adding a new machine:
# 1. Copy this file to configs/machines/<machine_id>.yaml
# 2. Fill in all fields above
# 3. Add a row to ENVIRONMENT.md machine table
# 4. Note any special setup steps (e.g. Docker required, port conflicts, no sudo)
# 5. Commit the new file
