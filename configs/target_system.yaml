target_agent:
  framework: langchain
  type: react_single_agent
  path: targets/langchain_react_agent/agent.py

llm_backend:
  type: vllm_openai_compatible
  # Read from env: VLLM_BASE_URL
  base_url_env: VLLM_BASE_URL
  model: Qwen/Qwen3-30B-A3B
  # Read from env: VLLM_API_KEY
  api_key_env: VLLM_API_KEY

tools:
  - name: slow_tool
    type: python_function
    module: targets.langchain_react_agent.tools
  - name: cpu_tool
    type: python_function
    module: targets.langchain_react_agent.tools
  - name: flaky_tool
    type: python_function
    module: targets.langchain_react_agent.tools
