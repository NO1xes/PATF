# AgentProf backend configuration
# Controls which implementation is used for observers and planner.
# Override with environment variables: AGENTPROF_BACKEND, AGENTPROF_PLANNER

observer_backend: langchain   # langchain | deepagent (future)
planner_backend: llm          # llm | rule

# Available observer backends:
#   langchain — semantic_langchain, llm_client_timing, tool_events, resource_snapshot
#               implemented in agentprof/observers/backends/langchain/
#
# Available planner backends:
#   llm  — LLM generates ObservationPlan (default, Milestone 3)
#           implemented in agentprof/planner/backends/llm/
#   rule — Deterministic rule-based selection, no LLM required
#           used for ablation experiments (baseline b)
#           implemented in agentprof/planner/backends/rule/
